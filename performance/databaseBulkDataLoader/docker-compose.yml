services:
  loader:
    image: postgres:16-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ../../example/postgres/schema:/example/postgres/schema:ro
    env_file:
      - .env
    environment:
      PG_CONN_STRING: ${PG_CONN_STRING}
      ASSET_COUNT: ${ASSET_COUNT}
      BATCH_SIZE: ${BATCH_SIZE}
    extra_hosts:
      - host.docker.internal:host-gateway
    command: ["sh", "-c", "tr -d '\r' < /workspace/load.sh > /tmp/load.sh && cp /workspace/check-schema.sql /workspace/truncate-db.sql /workspace/schema-generator.sql /workspace/load.sql /tmp/ && chmod +x /tmp/load.sh && sh /tmp/load.sh"]
    restart: "no"

# Usage:
# cp .env.example .env
# Edit PG_CONN_STRING
# docker compose up --build
