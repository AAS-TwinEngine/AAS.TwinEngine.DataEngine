services:
  loader:
    image: postgres:16-alpine
    working_dir: /workspace
    volumes:
      - ./:/workspace
      - ../../example/postgres/schema:/example/postgres/schema:ro
    env_file:
      - .env
    environment:
      PG_CONN_STRING: ${PG_CONN_STRING}
      ASSET_COUNT: ${ASSET_COUNT}
      BATCH_SIZE: ${BATCH_SIZE}
    extra_hosts:
      - host.docker.internal:host-gateway
    command: ["sh", "-c", "sed -i 's/\r$//' /workspace/load.sh && sh /workspace/load.sh"]
    restart: "no"

# Usage:
# cp .env.example .env
# Edit PG_CONN_STRING
# docker compose up --build
