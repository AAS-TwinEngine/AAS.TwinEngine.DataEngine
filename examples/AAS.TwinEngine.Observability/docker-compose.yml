include:
  - path:
      - ../AAS.TwinEngine.Minimal/docker-compose.yml
    project_directory: ../AAS.TwinEngine.Minimal

services:
  twinengine-dataengine:
    cpus: ${TWINENGINE_CPU:-0.5}
    mem_limit: ${TWINENGINE_MEMORY:-1g}
    depends_on:
      otel-lgtm:
        condition: service_started
    environment:
      General__OpenTelemetry__OtlpEndpoint: http://otel-lgtm:4317
      General__OpenTelemetry__ServiceName: TwinEngine

  dpp-plugin:
    cpus: ${DPP_PLUGIN_CPU:-0.5}
    mem_limit: ${DPP_PLUGIN_MEMORY:-1g}
    depends_on:
      otel-lgtm:
        condition: service_started
    environment:
      OpenTelemetry__OtlpEndpoint: http://otel-lgtm:4317
      OpenTelemetry__ServiceName: Plugin.RelationalDatabase

  postgres:
    ports:
      - "9999:5432"
    cpus: ${POSTGRES_CPU:-2}
    mem_limit: ${POSTGRES_MEMORY:-4g}

  otel-lgtm:
    image: grafana/otel-lgtm:0.29.0
    container_name: lgtm
    ports:
      - "3000:3000"
      - "9090:9090"
    volumes:
      - ./grafana/prometheus.yaml:/otel-lgtm/prometheus.yaml:ro
      - ./grafana/provisioning/dashboards/container-dashboard-provider.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/container-dashboard-provider.yaml:ro
      - ./grafana/dashboards/container-observability.json:/otel-config/grafana/dashboards/container-observability.json:ro
    networks:
      - twinengine-network

  docker-resource-exporter:
    build:
      context: ./observability
      dockerfile: Dockerfile.exporter
    container_name: docker-resource-exporter
    user: "0:0"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: always
    networks:
      - twinengine-network

  otel-docker-stats-collector:
    image: otel/opentelemetry-collector-contrib:0.153.0
    container_name: otel-docker-stats-collector
    user: "0:0"
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./observability/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      otel-lgtm:
        condition: service_started
    restart: always
    networks:
      - twinengine-network