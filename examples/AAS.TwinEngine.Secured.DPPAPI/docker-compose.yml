name: twinengine-secured-dppapi

include:
  - path:
      - ../AAS.TwinEngine.Secured.Export/docker-compose.yml
    project_directory: ../AAS.TwinEngine.Secured.Export

services:

  target-registry-repository:
    volumes:
      - ./security_env/access-rules.json:/security_env/access-rules.json:ro
      - ../AAS.TwinEngine.Secured/security_env/trustlist.json:/security_env/trustlist.json:ro
    environment:
      GENERAL_EXTERNALURL: http://localhost:8080
      ABAC_ENABLED: "true"
      ABAC_MODELPATH: /security_env/access-rules.json
      ABAC_POLICY_FILE_IMPORT: always
      OIDC_TRUSTLISTPATH: /security_env/trustlist.json
      BASYX_HISTORY_MODE: audit
      BASYX_HISTORY_RETENTION_DAYS: "0"
      BASYX_HISTORY_FULL_SNAPSHOT_INTERVAL: "1"
      BASYX_HISTORY_IMMUTABILITY: none
      BASYX_AUDIT_IDENTITY_MODE: extended
      BASYX_HISTORY_EVIDENCE_ENABLED: "false"
      BASYX_HISTORY_EVIDENCE_PROVIDER: none
      BASYX_HISTORY_INTEGRITY_ANCHOR_PROVIDER: none

  dpp-api:
    image: eclipsebasyx/dppapi-go:1.1.2
    container_name: dpp-api
    volumes:
      - ./security_env/access-rules.json:/security_env/access-rules.json:ro
      - ../AAS.TwinEngine.Secured/security_env/trustlist.json:/security_env/trustlist.json:ro
    environment:
      SERVER_PORT: "8083"
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DBNAME: basyxTargetDB
      POSTGRES_MAXOPENCONNECTIONS: "50"
      POSTGRES_MAXIDLECONNECTIONS: "25"
      POSTGRES_CONNMAXLIFETIMEMINUTES: "5"
      POSTGRES_CONNMAXIDLETIMEMINUTES: "0"
      GENERAL_AASREGISTRYINTEGRATION: "true"
      GENERAL_SUBMODELREGISTRYINTEGRATION: "true"
      GENERAL_DISCOVERYINTEGRATION: "true"
      ABAC_ENABLED: "true"
      ABAC_MODELPATH: /security_env/access-rules.json
      ABAC_POLICY_FILE_IMPORT: always
      OIDC_TRUSTLISTPATH: /security_env/trustlist.json
      GENERAL_EXTERNALURL: http://localhost:8080
      BASYX_HISTORY_MODE: audit
      BASYX_HISTORY_RETENTION_DAYS: "0"
      BASYX_HISTORY_FULL_SNAPSHOT_INTERVAL: "1"
      BASYX_HISTORY_IMMUTABILITY: none
      BASYX_AUDIT_IDENTITY_MODE: extended
      BASYX_HISTORY_EVIDENCE_ENABLED: "false"
      BASYX_HISTORY_EVIDENCE_PROVIDER: none
      BASYX_HISTORY_INTEGRITY_ANCHOR_PROVIDER: none
    ports:
      - "8083:8083"
    depends_on:
      basyx_configuration_target:
        condition: service_completed_successfully
      target-registry-repository:
        condition: service_healthy
      keycloak-healthcheck:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - twinengine-network
    extra_hosts:
      - "keycloak.localhost:host-gateway"

  otel-lgtm:
    ports: !override
      - "3000:3000"
      - "9091:9090"
