networks:
  twinengine-network:
    name: twinengine-network

volumes:
  postgres-data:

services:
  nginx:
    image: nginx:trixie-perl
    container_name: nginx
    ports:
      - "8080:80"
    volumes:
      - ../shared/nginx/html:/usr/share/nginx/html
      - ./nginx/default.conf.template:/etc/nginx/templates/default.conf.template
    restart: always
    depends_on:
      twinengine-dataengine:
        condition: service_started
      template-repository-registry:
        condition: service_started
    networks:
      - twinengine-network

  twinengine-dataengine:
    image: ghcr.io/aas-twinengine/dataengine:develop
    container_name: twinengine-dataengine
    depends_on:
      dpp-plugin:
        condition: service_started
      template-repository-registry:
        condition: service_started
      keycloak-healthcheck:
        condition: service_completed_successfully
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
    volumes:
      - ./dataengine-env.json:/config/dataengine-env.json:ro
    networks:
      - twinengine-network

  dpp-plugin:
    image: ghcr.io/aas-twinengine/plugindpp:develop
    container_name: dpp-plugin
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    environment:
      - Semantics__IndexContextPrefix=_aastwinengineindex_
      - Capabilities__HasShellDescriptor=true
      - Capabilities__HasAssetInformation=true
      - Capabilities__HasAssetIdSearch=true
      - RelationalDatabaseConfiguration__ConnectionString=Host=postgres;Port=5432;Database=twinengine;Username=postgres;Password=admin
      - ExtractionRules__SubmodelNameExtractionRules__0__SubmodelName=NamePlate
      - ExtractionRules__SubmodelNameExtractionRules__0__pattern__0=Nameplate
      - ExtractionRules__SubmodelNameExtractionRules__0__pattern__1=NamePlate
      - ExtractionRules__SubmodelNameExtractionRules__1__SubmodelName=MaintenanceInstructions
      - ExtractionRules__SubmodelNameExtractionRules__1__pattern__0=MaintenanceInstructions
      - ExtractionRules__SubmodelNameExtractionRules__1__pattern__1=MaintenanceInstruction
      - ExtractionRules__SubmodelNameExtractionRules__2__SubmodelName=HandoverDocumentation
      - ExtractionRules__SubmodelNameExtractionRules__2__pattern__0=HandoverDocumentation
      - ExtractionRules__SubmodelNameExtractionRules__2__pattern__1=HandoverDocumentations
      - ExtractionRules__SubmodelNameExtractionRules__3__SubmodelName=TechnicalData
      - ExtractionRules__SubmodelNameExtractionRules__3__pattern__0=TechnicalData
      - ExtractionRules__SubmodelNameExtractionRules__4__SubmodelName=CarbonFootprint
      - ExtractionRules__SubmodelNameExtractionRules__4__pattern__0=CarbonFootprint
      - ExtractionRules__SubmodelNameExtractionRules__4__pattern__1=Footprint
      - ExtractionRules__SubmodelNameExtractionRules__4__pattern__2=Carbon
      - ExtractionRules__ProductIdExtractionRules__0__Pattern=/
      - ExtractionRules__ProductIdExtractionRules__0__Index=5
      - ExtractionRules__ProductIdExtractionRules__0__Strategy=Split
      - ExtractionRules__ProductIdExtractionRules__0__Description=Default split by '/' segment 5
    networks:
      - twinengine-network

  template-repository-registry:
    image: eclipsebasyx/aasenvironment-go:SNAPSHOT
    container_name: template-repository-registry
    pull_policy: always
    command: ["/app/aasenvironmentservice"]
    ports:
      - "8082:8082"
    volumes:
      - ../shared/aas:/app/preconfiguration:ro
      - ./security_env:/security_env:ro
    environment:
      - SERVER_PORT=8082
      - SERVER_VERIFICATIONENDPOINTAVAILABLE=true
      - CORS_ALLOWEDORIGINS=*
      - CORS_ALLOWEDHEADERS=*
      - CORS_ALLOWEDCREDENTIALS=true
      - CORS_ALLOWEDMETHODS=GET,OPTIONS
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DBNAME=basyxTestDB
      - POSTGRES_MAXOPENCONNECTIONS=500
      - POSTGRES_MAXIDLECONNECTIONS=500
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
      - ABAC_ENABLED=true
      - ABAC_MODELPATH=/security_env/access-rules.json
      - ABAC_POLICY_FILE_IMPORT=always
      - OIDC_TRUSTLISTPATH=/security_env/trustlist.json
      - GENERAL_AASREGISTRYINTEGRATION=true
      - GENERAL_SUBMODELREGISTRYINTEGRATION=true
      - GENERAL_DISCOVERYINTEGRATION=true
      - GENERAL_EXTERNALURL=http://localhost:8080
      - GENERAL_AAS_PRECONFIG_PATHS=/app/preconfiguration
    depends_on:
      basyx_configuration:
        condition: service_completed_successfully
      keycloak-healthcheck:
        condition: service_completed_successfully
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    restart: always
    networks:
      - twinengine-network

  basyx_configuration:
    container_name: basyx_configuration
    image: eclipsebasyx/basyxconfigurationservice-go:SNAPSHOT
    pull_policy: always
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DBNAME=basyxTestDB
      - POSTGRES_MAXOPENCONNECTIONS=500
      - POSTGRES_MAXIDLECONNECTIONS=500
      - POSTGRES_CONNMAXLIFETIMEMINUTES=5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - twinengine-network

  aas-web-ui:
    image: eclipsebasyx/aas-gui:SNAPSHOT
    container_name: aas-ui
    volumes:
      - ../shared/logo:/usr/src/app/dist/Logo
    environment:
      AAS_REGISTRY_PATH: http://localhost:8080/shell-descriptors
      SUBMODEL_REGISTRY_PATH: http://localhost:8080/submodel-descriptors
      AAS_REPO_PATH: http://localhost:8080/shells
      SUBMODEL_REPO_PATH: http://localhost:8080/submodels
      CD_REPO_PATH: http://localhost:8080/concept-descriptions
      BASE_PATH: "/aas-ui"
      LOGO_PATH: "MM_Logo.svg"
      PRIMARY_DARK_COLOR: "#00F2E5"
      PRIMARY_LIGHT_COLOR: "#041b2b"
      ENDPOINT_CONFIG_AVAILABLE: "false"
      KEYCLOAK_URL: http://localhost:9090
      KEYCLOAK_REALM: basyx
      KEYCLOAK_CLIENT_ID: basyx-ui
      ALLOW_EDITING: "false"
      SM_VIEWER_EDITOR: "false"
      ALLOW_UPLOADING: "false"
    depends_on:
      template-repository-registry:
        condition: service_started
      keycloak-healthcheck:
        condition: service_completed_successfully
    extra_hosts:
      - "keycloak.localhost:host-gateway"
    restart: always
    networks:
      - twinengine-network

  keycloak:
    image: keycloak/keycloak:26.0.6
    container_name: keycloak
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/basyxTestDB
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: admin
      KC_HOSTNAME: keycloak.localhost
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HTTP_ENABLED: "true"
      KC_HTTPS_ENABLED: "false"
      KC_HEALTH_ENABLED: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_BACKCHANNEL: "false"
      KC_HTTP_PORT: "9090"
      KC_HTTP_MANAGEMENT_PORT: "9000"
      KC_IMPORT: /opt/keycloak/data/import/
      KC_HTTP_MANAGEMENT_ENABLED: "true"
    command: ["start-dev", "--import-realm", "--health-enabled=true", "--http-port=9090"]
    ports:
      - "9090:9090"
    volumes:
      - ../securedExample/keycloak/realm:/opt/keycloak/data/import:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - twinengine-network

  keycloak-healthcheck:
    image: curlimages/curl:latest
    container_name: keycloak-healthcheck
    command: >
      sh -c "
        echo 'Waiting for Keycloak to become ready...';
        until curl -sf http://keycloak:9000/health/ready; do
          sleep 5;
        done;
        echo 'Keycloak is ready!'"
    depends_on:
      - keycloak
    networks:
      - twinengine-network

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: twinengine
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    volumes:
      - ../shared/postgres:/docker-entrypoint-initdb.d
      - postgres-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d twinengine"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - twinengine-network

  pgadmin:
    image: dpage/pgadmin4:snapshot
    container_name: pgadmin
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    depends_on:
      postgres:
        condition: service_healthy
    restart: always
    networks:
      - twinengine-network
