info:
  name: Read Historical DPP Version
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/v1/dppsByIdAndDate/:dppIdEncoded?date={{currentTimestamp}}&representation={{representation}}"
  params:
    - name: date
      value: "{{currentTimestamp}}"
      type: query
    - name: representation
      value: "{{representation}}"
      type: query
    - name: dppIdEncoded
      value: "{{dppId1}}"
      type: path
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: bru.setVar("currentTimestamp", new Date().toISOString());

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
