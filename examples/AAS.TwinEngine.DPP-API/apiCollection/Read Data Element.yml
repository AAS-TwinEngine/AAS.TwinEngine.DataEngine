info:
  name: Read Data Element
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/v1/dpps/:dppIdEncoded/elements/:elementIdPathEncoded?representation={{representation}}"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: representation
      value: "{{representation}}"
      type: query
    - name: elementIdPathEncoded
      value: "{{elementIdPath}}"
      type: path
    - name: dppIdEncoded
      value: "{{dppId1}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
