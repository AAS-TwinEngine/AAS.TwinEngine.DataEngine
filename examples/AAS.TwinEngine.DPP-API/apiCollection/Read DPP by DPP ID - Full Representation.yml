info:
  name: Read DPP by DPP ID - Full Representation
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/v1/dpps/:dppIdEncoded?representation=full"
  headers:
    - name: Accept
      value: application/json
  params:
    - name: representation
      value: full
      type: query
    - name: dppIdEncoded
      value: "{{dppId1}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
