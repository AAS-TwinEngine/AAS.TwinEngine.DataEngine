info:
  name: Read DPP by Product ID
  type: http
  seq: 4

http:
  method: GET
  url: "{{baseUrl}}/v1/dppsByProductId/:productIdEncoded?representation={{representation}}"
  params:
    - name: representation
      value: "{{representation}}"
      type: query
    - name: productIdEncoded
      value: "{{productId1}}"
      type: path
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
