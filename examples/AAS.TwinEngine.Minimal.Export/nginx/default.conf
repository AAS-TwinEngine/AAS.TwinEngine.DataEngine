server {
    listen 80;
    server_name _;
    absolute_redirect off;

    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /healthz {
        proxy_pass http://target-registry-repository:8082/health;
    }

    location = / {
        return 302 /aas-ui/;
    }

    location = /aas-ui {
        return 302 /aas-ui/;
    }

    location /aas-ui/ {
        proxy_pass http://aas-ui-target:3000;
    }

    location /fileprovider/ {
        limit_except GET OPTIONS {
            deny all;
        }
        root /usr/share/nginx/html;
    }

    location /shell-descriptors {
        limit_except GET OPTIONS {
            deny all;
        }
        proxy_pass http://target-registry-repository:8082;
    }

    location /lookup {
        limit_except POST GET OPTIONS {
            deny all;
        }
        proxy_pass http://target-registry-repository:8082;
    }

    location /shells {
        limit_except GET OPTIONS {
            deny all;
        }
        proxy_pass http://target-registry-repository:8082;
    }

    location /submodels {
        limit_except GET OPTIONS {
            deny all;
        }
        proxy_pass http://target-registry-repository:8082;
    }

    location /concept-descriptions {
        limit_except GET OPTIONS {
            deny all;
        }
        proxy_pass http://target-registry-repository:8082;
    }

    location /submodel-descriptors {
        limit_except GET OPTIONS {
            deny all;
        }
        proxy_pass http://target-registry-repository:8082;
    }

    location /serialization {
        limit_except GET OPTIONS {
            deny all;
        }
        proxy_pass http://target-registry-repository:8082;
    }

    location /description {
        limit_except GET OPTIONS {
            deny all;
        }
        proxy_pass http://target-registry-repository:8082;
    }

    location / {
        return 404;
    }
}
