runtime:
  scripts:
    - type: before-request
      code: bru.setVar("currentTimestamp", new Date().toISOString());
    - type: tests
      code: |-
        test("created or already exists", function () {
          expect([201, 409]).to.include(res.getStatus());
        });

        if (res.getStatus() === 201) {
          const body = res.getBody();
          bru.setVar("dppId", body.digitalProductPassportId);
          bru.setVar("historicalDate", new Date().toISOString());
        }

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
