name: twinengine-dppapi

include:
  - path:
      - ../AAS.TwinEngine.Minimal.Export/docker-compose.yml
    project_directory: ../AAS.TwinEngine.Minimal.Export

services:
  dpp-api:
    image: eclipsebasyx/dppapi-go:1.1.2
    container_name: dpp-api
    environment:
      SERVER_PORT: "8083"
      CORS_ALLOWEDORIGINS: "*"
      CORS_ALLOWEDHEADERS: "*"
      CORS_ALLOWEDMETHODS: GET,POST,PUT,PATCH,DELETE,OPTIONS
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
      POSTGRES_DBNAME: basyxTargetDB
      POSTGRES_MAXOPENCONNECTIONS: "50"
      POSTGRES_MAXIDLECONNECTIONS: "25"
      POSTGRES_CONNMAXLIFETIMEMINUTES: "5"
      POSTGRES_CONNMAXIDLETIMEMINUTES: "0"
      ABAC_ENABLED: "false"
      GENERAL_AASREGISTRYINTEGRATION: "true"
      GENERAL_SUBMODELREGISTRYINTEGRATION: "true"
      GENERAL_DISCOVERYINTEGRATION: "true"
      GENERAL_EXTERNALURL: http://localhost:8083
    ports:
      - "8083:8083"
    depends_on:
      basyx_configuration_target:
        condition: service_completed_successfully
      target-registry-repository:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/bin/healthprobe"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    networks:
      - twinengine-network
