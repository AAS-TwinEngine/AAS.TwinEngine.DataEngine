server.port=8081
basyx.environment=file:aas
basyx.cors.allowed-origins=*
basyx.cors.allowed-methods=GET,POST,PATCH,DELETE,PUT,OPTIONS,HEAD
basyx.aasrepository.feature.registryintegration=http://aas-template-registry:8080
basyx.submodelrepository.feature.registryintegration=http://sm-template-registry:8080
spring.servlet.multipart.max-file-size=128MB
spring.servlet.multipart.max-request-size=128MB
basyx.backend=MongoDB
spring.mongodb.host=mongo
spring.mongodb.port=27017
spring.mongodb.database=aasenvironment
spring.mongodb.authentication-database=admin
spring.mongodb.username=mongoAdmin
spring.mongodb.password=mongoPassword

