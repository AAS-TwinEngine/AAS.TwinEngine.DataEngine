# SonarCloud scan configuration.
# See https://docs.sonarsource.com/sonarcloud/enriching/exclusions/

# Exclude the two log-sanitizer files from Copy/Paste Detection.
# These files are intentionally maintained in each service (ExportService,
# DataEngine, DPP plugin, RelationalDatabase plugin) until a shared NuGet
# package is published. All other Sonar rules still apply to them.
sonar.cpd.exclusions=**/Infrastructure/Logging/LogSanitizerExtension.cs,**/Infrastructure/Logging/SanitizingEnricher.cs
